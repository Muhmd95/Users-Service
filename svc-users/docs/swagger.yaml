basePath: /
definitions:
  users.AddPhoneRequest:
    properties:
      phone_number:
        type: string
    type: object
  users.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  users.CreateWalletProxyRequest:
    properties:
      currency_code:
        type: string
      phone_number:
        type: string
      user_id:
        type: string
    type: object
  users.CreateWalletProxyResponse:
    properties:
      balance:
        type: integer
      created_at:
        type: string
      wallet_id:
        type: string
    type: object
  users.GetUserResponse:
    properties:
      birth_date:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      is_verified:
        type: boolean
      national_id:
        type: string
      phone_numbers:
        items:
          type: string
        type: array
      status:
        type: string
      user_id:
        type: string
      wallet_ids:
        items:
          type: string
        type: array
    type: object
  users.GetUserWalletsResponse:
    properties:
      count:
        type: integer
      wallets:
        items:
          $ref: '#/definitions/users.WalletSummary'
        type: array
    type: object
  users.GetWalletBalanceProxyResponse:
    properties:
      balance:
        type: integer
      updated_at:
        type: string
      wallet_id:
        type: string
    type: object
  users.LoginRequest:
    properties:
      password:
        type: string
      phone_number:
        description: using phone number for login
        type: string
    type: object
  users.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      user_id:
        type: string
    type: object
  users.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  users.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
    type: object
  users.RegisterUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      national_id:
        type: string
      password:
        type: string
      phone_number:
        type: string
    type: object
  users.RegisterUserResponse:
    properties:
      created_at:
        type: string
      message:
        type: string
      user_id:
        type: string
    type: object
  users.UpdateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
    type: object
  users.WalletSummary:
    properties:
      balance:
        type: integer
      currency_code:
        type: string
      phone_number:
        type: string
      wallet_id:
        type: string
    type: object
host: localhost:8001
info:
  contact: {}
  description: This is the REST API for the Users Service.
  title: Users Service API
  version: "1.0"
paths:
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a verified user with phone number and password. Returns a JWT with token_type=access in JSON; the token_type=refresh JWT is returned only in the refresh_token cookie, not in the JSON body.
        The cookie uses HttpOnly, SameSite=Strict and Path=/; Secure is false only when APP_ENV=development. Cookie Max-Age is 30 days, independently of the configured refresh JWT lifetime. expires_in is the access-token lifetime in seconds.
      parameters:
      - description: Login Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: refresh_token cookie; Secure except in development
              type: string
          schema:
            $ref: '#/definitions/users.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Auth
  /v1/users/logout:
    post:
      description: Requires a token_type=access bearer token. Revokes all stored refresh
        tokens for the authenticated user and clears the refresh_token cookie. Already-issued
        access tokens remain valid until expiry.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              description: Clears refresh_token with the same Secure policy used at
                login
              type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /v1/users/me:
    delete:
      description: Performs a soft delete of the user's account.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete My Account
      tags:
      - Profile
    get:
      description: Retrieves the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/users.GetUserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get My Profile
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: |-
        Updates the profile details of the currently authenticated user. Changing the email sets is_verified=false in the same database update. An unchanged email or a name-only update preserves verification. No new verification email is sent by this endpoint yet.
        Invalid names and email addresses return 400.
      parameters:
      - description: Update Profile Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated
          schema:
            $ref: '#/definitions/users.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update My Profile
      tags:
      - Profile
  /v1/users/me/password:
    put:
      consumes:
      - application/json
      description: |-
        Requires a token_type=access bearer token and the old password. Saves the new password hash, attempts to revoke all existing refresh tokens, and issues a new access token in JSON and a refresh_token cookie.
        The cookie is HttpOnly and SameSite=Strict; Secure is false only in development. Already-issued access tokens remain valid until expiry. Refresh-token revocation failures are currently logged without failing this operation.
      parameters:
      - description: Change Password Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          headers:
            Set-Cookie:
              description: Replacement refresh_token cookie; Secure except in development
              type: string
          schema:
            $ref: '#/definitions/users.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Auth
  /v1/users/me/phones:
    post:
      consumes:
      - application/json
      description: Adds a secondary phone number to the user.
      parameters:
      - description: Add Phone Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.AddPhoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Phone number added
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add Phone Number
      tags:
      - Phone
  /v1/users/me/phones/{phone}:
    delete:
      description: Removes a secondary phone number from the user.
      parameters:
      - description: Phone Number
        in: path
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Phone number removed
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove Phone Number
      tags:
      - Phone
  /v1/users/me/wallets:
    get:
      description: Retrieves a list of wallets owned by the user.
      produces:
      - application/json
      responses:
        "200":
          description: List of wallets
          schema:
            $ref: '#/definitions/users.GetUserWalletsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get My Wallets
      tags:
      - Wallet
    post:
      consumes:
      - application/json
      description: Creates a wallet for the user via Wallet Service.
      parameters:
      - description: Create Wallet Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.CreateWalletProxyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Wallet created
          schema:
            $ref: '#/definitions/users.CreateWalletProxyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Wallet
      tags:
      - Wallet
  /v1/users/me/wallets/{wallet_id}:
    delete:
      description: Deletes a specific wallet owned by the user.
      parameters:
      - description: Wallet ID
        in: path
        name: wallet_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden (Not Owner)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete Wallet
      tags:
      - Wallet
  /v1/users/me/wallets/{wallet_id}/balance:
    get:
      description: Retrieves the balance for a wallet owned by the user.
      parameters:
      - description: Wallet ID
        in: path
        name: wallet_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Wallet balance
          schema:
            $ref: '#/definitions/users.GetWalletBalanceProxyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden (Not Owner)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Wallet Balance
      tags:
      - Wallet
  /v1/users/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Requires a signed, unexpired JWT with token_type=refresh and a matching non-revoked database record. Access tokens and older tokens without token_type are rejected.
        Reads refresh_token from the HttpOnly cookie or optional JSON body; a nonempty cookie takes precedence. Returns a new token_type=access JWT without rotating the refresh token or replacing its cookie. expires_in is measured in seconds.
      parameters:
      - description: Refresh Token Payload (or via HttpOnly Cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/users.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed
          schema:
            $ref: '#/definitions/users.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh Access Token
      tags:
      - Auth
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: Register Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/users.RegisterUserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /v1/users/verify-email:
    get:
      description: Verifies a user's email using a token. Missing, invalid, expired,
        or orphaned verification tokens return 400; database or Redis failures return
        500.
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Email
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    description: Enter Bearer <access_token>. Requires a signed, unexpired JWT with
      token_type=access; refresh tokens and older tokens without token_type are rejected.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
